<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" fill="none" font-family="Inter, Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" role="img" aria-label="kitten443 — backend engineer working with Go, Python 3 and PHP">
  <title>kitten443 — Backend Engineer</title>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1180" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1020"/>
      <stop offset="0.55" stop-color="#0C1526"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="h-glowC" cx="0" cy="0" r="1" gradientTransform="translate(150 10) scale(360 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glowV" cx="0" cy="0" r="1" gradientTransform="translate(1070 300) scale(340 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glowNode" cx="0" cy="0" r="1" gradientTransform="translate(911 150) scale(90)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4CC2FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4CC2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-name" x1="60" y1="100" x2="430" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#C9DEFF"/>
      <stop offset="1" stop-color="#8FA6FF"/>
    </linearGradient>
    <linearGradient id="h-hair" x1="0" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="h-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#FFFFFF" stroke-opacity="0.038" stroke-width="1"/>
    </pattern>
    <clipPath id="h-clip">
      <rect width="1180" height="300" rx="26"/>
    </clipPath>
    <style>
      @keyframes h-flow { to { stroke-dashoffset: -30; } }
      @keyframes h-pulse { 0%,100% { opacity: 0.18; } 50% { opacity: 0.5; } }
      @keyframes h-ring { 0% { r: 26; opacity: 0.55; } 100% { r: 68; opacity: 0; } }
      .h-flow { stroke-dasharray: 5 10; animation: h-flow 1.9s linear infinite; }
      .h-pulse { animation: h-pulse 3.2s ease-in-out infinite; }
      .h-ring { animation: h-ring 3.4s ease-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#h-clip)">
    <rect width="1180" height="300" fill="url(#h-bg)"/>
    <rect width="1180" height="300" fill="url(#h-grid)"/>
    <rect width="1180" height="300" fill="url(#h-glowC)"/>
    <rect width="1180" height="300" fill="url(#h-glowV)"/>
    <rect x="0.5" y="0.5" width="1179" height="299" rx="25.5" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="0" y="0" width="1180" height="1.6" fill="url(#h-hair)"/>

    <!-- identity -->
    <rect x="60" y="52" width="206" height="30" rx="15" fill="#4CC2FF" fill-opacity="0.09" stroke="#4CC2FF" stroke-opacity="0.32"/>
    <circle cx="78" cy="67" r="3.6" fill="#4CC2FF"/>
    <circle cx="78" cy="67" r="7.5" fill="#4CC2FF" fill-opacity="0.2" class="h-pulse"/>
    <text x="92" y="71.6" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#7DD3FC">BACKEND ENGINEER</text>

    <text x="60" y="152" font-size="63" font-weight="800" letter-spacing="-1.6" fill="url(#h-name)">kitten443</text>

    <g font-size="16.5" font-weight="600">
      <circle cx="66" cy="186" r="4.2" fill="#29C8E8"/>
      <text x="78" y="191.4" fill="#D8E4F7">Go</text>
      <circle cx="132" cy="186" r="4.2" fill="#FFC93C"/>
      <text x="144" y="191.4" fill="#D8E4F7">Python 3</text>
      <circle cx="248" cy="186" r="4.2" fill="#A98BFF"/>
      <text x="260" y="191.4" fill="#D8E4F7">PHP</text>
    </g>

    <text x="60" y="231" font-size="17" fill="#93A4C2">I design APIs, data planes and infrastructure that stay reliable at 3 a.m.</text>

    <g>
      <rect x="60" y="249" width="124" height="27" rx="13.5" fill="#4CC2FF" fill-opacity="0.1" stroke="#4CC2FF" stroke-opacity="0.34"/>
      <text x="74" y="267" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#8BD8FF">xlada.app</text>
      <path d="M158 258.5h6.5m0 0v6.5m0-6.5-7 7" stroke="#8BD8FF" stroke-opacity="0.9" stroke-width="1.3" stroke-linecap="round"/>
      <text x="199" y="267.5" font-size="13" fill="#6F7F9C">proxy control plane on Xray-core</text>
    </g>

    <!-- request-flow panel -->
    <rect x="716" y="46" width="404" height="208" rx="18" fill="#FFFFFF" fill-opacity="0.028" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="738" y="70" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#5E6F8C">// REQUEST FLOW</text>

    <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">
      <rect x="738" y="98" width="76" height="28" rx="9" fill="#29C8E8" fill-opacity="0.08" stroke="#29C8E8" stroke-opacity="0.3"/>
      <circle cx="752" cy="112" r="3.2" fill="#29C8E8"/>
      <text x="762" y="116" fill="#8FE0F5">GO</text>

      <rect x="738" y="136" width="76" height="28" rx="9" fill="#FFC93C" fill-opacity="0.07" stroke="#FFC93C" stroke-opacity="0.28"/>
      <circle cx="752" cy="150" r="3.2" fill="#FFC93C"/>
      <text x="762" y="154" fill="#FFDF8E">PY3</text>

      <rect x="738" y="174" width="76" height="28" rx="9" fill="#A98BFF" fill-opacity="0.08" stroke="#A98BFF" stroke-opacity="0.3"/>
      <circle cx="752" cy="188" r="3.2" fill="#A98BFF"/>
      <text x="762" y="192" fill="#C9B7FF">PHP</text>
    </g>

    <g stroke="#4CC2FF" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round">
      <path d="M814 112C840 112 848 150 866 150" class="h-flow"/>
      <path d="M814 150H866" class="h-flow"/>
      <path d="M814 188C840 188 848 150 866 150" class="h-flow"/>
    </g>
    <g stroke="#3FD68C" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round">
      <path d="M958 150H996" class="h-flow"/>
    </g>

    <circle cx="911" cy="150" r="52" fill="url(#h-glowNode)"/>
    <circle cx="911" cy="150" r="30" fill="none" stroke="#4CC2FF" stroke-opacity="0.35" class="h-ring"/>
    <rect x="866" y="117" width="90" height="66" rx="15" fill="#0D1A2E" stroke="#4CC2FF" stroke-opacity="0.45"/>
    <text x="911" y="147" text-anchor="middle" font-size="16.5" font-weight="700" fill="#EAF3FF">API</text>
    <text x="911" y="165" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4" fill="#61809F">EDGE</text>

    <rect x="996" y="120" width="106" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="1049" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#D8E4F7">DATA</text>
    <text x="1049" y="163" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#61809F">pg · redis</text>

    <g fill="#3FD68C">
      <circle cx="960" cy="150" r="2.6"/>
      <circle cx="978" cy="150" r="2.6" fill-opacity="0.6"/>
      <circle cx="990" cy="150" r="2.6" fill-opacity="0.3"/>
    </g>
  </g>
</svg>
