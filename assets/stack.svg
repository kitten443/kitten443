    <g>
      <rect x="788" y="120" width="336" height="200" rx="16" fill="#FFFFFF" fill-opacity="0.028" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <circle cx="818" cy="152" r="4.4" fill="#A98BFF"/>
      <text x="832" y="156" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.4" fill="#A98BFF">PHP</text>
      <text x="816" y="194" font-size="22" font-weight="700" fill="#EAF1FB">Web APIs &amp; glue</text>
      <text x="816" y="218" font-size="13.5" fill="#8FA0BC">Back-office, integrations, legacy</text>
