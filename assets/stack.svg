    <rect width="1180" height="420" fill="url(#s-glowB)"/>
    <rect x="0.5" y="0.5" width="1179" height="419" rx="25.5" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect width="1180" height="1.6" fill="url(#s-hair)"/>

