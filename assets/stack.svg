      <rect x="490" y="364" width="60" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="503" y="380">Linux</text>
      <rect x="560" y="364" width="60" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="573" y="380">Nginx</text>
      <rect x="630" y="364" width="46" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="641" y="380">Git</text>
    </g>
    <text x="1124" y="380" text-anchor="end" font-size="12.5" fill="#6F7F9C">and a healthy distrust of anything unmeasured</text>
  </g>
