        <text x="829" y="254" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">REST APIs</text>
        <rect x="960" y="236" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="973" y="254" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">MySQL</text>
        <rect x="816" y="272" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="829" y="290" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">composer</text>
        <rect x="960" y="272" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="973" y="290" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">migrations</text>
