    <!-- foundation -->
    <line x1="56" y1="344" x2="1124" y2="344" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="56" y="380" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.6" fill="#5E6F8C">SHARED FOUNDATION</text>
    <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#9FB0C9">
      <rect x="240" y="364" width="94" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="253" y="380">PostgreSQL</text>
      <rect x="344" y="364" width="60" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="357" y="380">Redis</text>
      <rect x="414" y="364" width="66" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
