        <text x="241" y="254" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">goroutines</text>
        <rect x="84" y="272" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="97" y="290" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">CLI tooling</text>
        <rect x="228" y="272" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="241" y="290" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">xray-core</text>
      </g>
