<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" fill="none" font-family="Inter, Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Stack: Go for services and gateways, Python 3 for automation and tooling, PHP for web APIs and integrations">
  <title>Stack — Go, Python 3, PHP</title>
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1180" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1020"/>
      <stop offset="0.6" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="s-glowA" cx="0" cy="0" r="1" gradientTransform="translate(120 20) scale(300 200)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s-glowB" cx="0" cy="0" r="1" gradientTransform="translate(1090 430) scale(320 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-hair" x1="0" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="0.65" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-go" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#29C8E8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#29C8E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-py" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFC93C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s-php" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A98BFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A98BFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="s-grid" width="34" height="34" patternUnits="userSpaceOnUse">
