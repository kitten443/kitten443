        <text x="463" y="254" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">asyncio</text>
        <rect x="594" y="236" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="607" y="254" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">aiohttp</text>
        <rect x="450" y="272" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="463" y="290" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">parsers</text>
        <rect x="594" y="272" width="136" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="607" y="290" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#B9C8DE">CVE checks</text>
      </g>
