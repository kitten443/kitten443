<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" fill="none" font-family="Inter, Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" role="img" aria-label="XLADA — proxy control plane on Xray-core, at xlada.app">
  <title>XLADA — proxy control plane</title>
  <defs>
    <linearGradient id="x-bg" x1="0" y1="0" x2="1180" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F1F"/>
      <stop offset="0.5" stop-color="#0C1226"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="x-glowA" cx="0" cy="0" r="1" gradientTransform="translate(620 300) scale(360 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="x-glowB" cx="0" cy="0" r="1" gradientTransform="translate(1080 20) scale(300 200)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="x-hair" x1="0" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="x-mark" x1="68" y1="98" x2="88" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="x-word" x1="112" y1="100" x2="300" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBB9FF"/>
    </linearGradient>
    <pattern id="x-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="x-clip"><rect width="1180" height="300" rx="26"/></clipPath>
    <style>
      @keyframes x-flow { to { stroke-dashoffset: -20; } }
      @keyframes x-pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .x-flow { stroke-dasharray: 4 7; animation: x-flow 1.7s linear infinite; }
      .x-pulse { animation: x-pulse 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#x-clip)">
    <rect width="1180" height="300" fill="url(#x-bg)"/>
    <rect width="1180" height="300" fill="url(#x-grid)"/>
    <rect width="1180" height="300" fill="url(#x-glowA)"/>
    <rect width="1180" height="300" fill="url(#x-glowB)"/>
    <rect x="0.5" y="0.5" width="1179" height="299" rx="25.5" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect width="1180" height="1.6" fill="url(#x-hair)"/>

    <!-- left: identity + copy -->
    <text x="56" y="54" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="2.6" fill="#A98BFF">// FEATURED WORK</text>

    <rect x="56" y="76" width="44" height="44" rx="12" fill="#A98BFF" fill-opacity="0.1" stroke="#A98BFF" stroke-opacity="0.4"/>
    <g stroke="url(#x-mark)" stroke-width="1.6" stroke-opacity="0.85" stroke-linecap="round">
      <path d="M78 98L70 89M78 98L86 89M78 98V108"/>
    </g>
    <circle cx="78" cy="98" r="3" fill="#DDD3FF"/>
    <circle cx="70" cy="89" r="2" fill="#A78BFA"/>
    <circle cx="86" cy="89" r="2" fill="#A78BFA"/>
    <circle cx="78" cy="108" r="2" fill="#7DD3FC"/>
    <text x="114" y="111" font-size="33" font-weight="800" letter-spacing="1.2" fill="url(#x-word)">XLADA</text>
    <text x="248" y="108" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.4" fill="#5E6F8C">v1.1.7</text>

    <text x="56" y="152" font-size="15.5" font-weight="500" fill="#C9D6EA">Proxy control plane on Xray-core — users, nodes, subscriptions.</text>
    <text x="56" y="178" font-size="12.8" fill="#8FA0BC">Privacy-hardened fork of Remnawave: multi-node routing, audit log, data</text>
    <text x="56" y="197" font-size="12.8" fill="#8FA0BC">retention, HWID device limits and a documented 162-endpoint REST API.</text>

    <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#A8B8D2">
      <rect x="56" y="218" width="76" height="24" rx="12" fill="#A98BFF" fill-opacity="0.09" stroke="#A98BFF" stroke-opacity="0.28"/>
      <text x="68" y="234">AGPL-3.0</text>
      <rect x="140" y="218" width="132" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="152" y="234">162 endpoints</text>
      <rect x="280" y="218" width="94" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="292" y="234">multi-node</text>
      <rect x="382" y="218" width="102" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="394" y="234">HWID limits</text>
    </g>

    <g>
      <text x="56" y="275" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#8BD8FF">xlada.app</text>
      <path d="M136 266h6m0 0v6m0-6-7 7" stroke="#8BD8FF" stroke-width="1.3" stroke-linecap="round"/>
      <text x="170" y="275" font-size="12.5" fill="#5E6F8C">docs · panel · node agent · subscription page · deploy</text>
    </g>

    <!-- right: topology -->
    <rect x="700" y="44" width="424" height="222" rx="16" fill="#FFFFFF" fill-opacity="0.026" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="720" y="68" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="2" fill="#5E6F8C">// TOPOLOGY</text>

    <g>
      <rect x="720" y="92" width="118" height="60" rx="12" fill="#A98BFF" fill-opacity="0.08" stroke="#A98BFF" stroke-opacity="0.38"/>
      <text x="734" y="118" font-size="12" font-weight="700" letter-spacing="0.6" fill="#E4DAFF">PANEL</text>
      <text x="734" y="136" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="8.5" fill="#8F84B8">rest · web ui</text>

      <rect x="868" y="92" width="112" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="882" y="118" font-size="12" font-weight="700" letter-spacing="0.6" fill="#E9EFFA">NODE</text>
      <text x="882" y="136" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="8.5" fill="#6F7F9C">agent</text>

      <rect x="1010" y="92" width="94" height="60" rx="12" fill="#4CC2FF" fill-opacity="0.06" stroke="#4CC2FF" stroke-opacity="0.32"/>
      <text x="1024" y="118" font-size="12" font-weight="700" letter-spacing="0.4" fill="#BFE6FF">XRAY</text>
      <text x="1024" y="136" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="8.5" fill="#6E93AE">core</text>
    </g>

    <g stroke="#4CC2FF" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" class="x-flow">
      <path d="M838 122h30"/>
      <path d="M980 122h30"/>
    </g>
    <g fill="#4CC2FF" fill-opacity="0.6">
      <path d="M863 118l6 4-6 4z"/>
      <path d="M1005 118l6 4-6 4z"/>
    </g>

    <rect x="720" y="182" width="118" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="734" y="205" font-size="11.5" font-weight="600" fill="#DCE6F6">SUB PAGE</text>
    <text x="734" y="222" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="8.5" fill="#6F7F9C">mihomo · sing-box</text>
    <path d="M779 182v-28" stroke="#A98BFF" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" class="x-flow"/>
    <path d="M775 160l4-6 4 6z" fill="#A98BFF" fill-opacity="0.6"/>

    <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#5E6F8C">
      <text x="866" y="206">subscriptions · hwid ·</text>
      <text x="866" y="222">webhooks · audit trail</text>
    </g>

    <circle cx="1088" cy="104" r="3" fill="#3FD68C" class="x-pulse"/>
  </g>
</svg>
